name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.4.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gate
        run: pnpm quality
      - name: Validate Drizzle migration metadata
        run: pnpm --filter @wedding-quest/database db:check
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Audit runtime dependencies
        run: pnpm audit --prod

  build:
    name: Production build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.4.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web application
        run: pnpm build
      - name: Verify initial JavaScript budget
        run: pnpm verify:web-budget
      - name: Verify client bundle boundaries
        run: pnpm verify:client-boundaries

  integration:
    name: PostgreSQL, Redis, and BullMQ integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: wedding_quest
          POSTGRES_PASSWORD: wedding_quest_local
          POSTGRES_USER: wedding_quest
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wedding_quest -d wedding_quest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.4.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations and validate sample seed
        run: pnpm db:migrate && pnpm seed:validate
      - name: Probe infrastructure
        run: pnpm infra:probe

  browser:
    name: Browser smoke tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.4.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Build web application
        run: pnpm build
      - name: Run browser smoke tests
        run: pnpm test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
