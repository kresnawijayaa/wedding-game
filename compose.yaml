name: wedding-quest

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: wedding_quest
      POSTGRES_PASSWORD: wedding_quest_local
      POSTGRES_USER: wedding_quest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_quest -d wedding_quest"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-56379}:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
